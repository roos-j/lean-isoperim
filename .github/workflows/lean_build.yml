# This file was automatically generated by Claude.
#
# Builds the Lean library (`lake build`) on every push and pull request. `leanprover/lean-action`
# installs the toolchain pinned in `lean-toolchain` and fetches the prebuilt Mathlib cache.

name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          use-mathlib-cache: true
