fidelity:
  divergences: >-
    Lean encodings: the cube is Fin n -> ZMod 2; expectation, density and h_A are defined
    explicitly; the isoperimetric profile is a single infimum over all pairs (n, A) with n >= 1
    and takes the junk value 0 off the dyadic rationals (Corollary 2.5 is stated on the dyadic
    rationals); the function J is defined by choice from its characterizing ODE and boundary
    conditions; the dimension n >= 1 is assumed in Theorems 1.1-1.3 and (2.5). The statements are
    otherwise as in the papers. Several small inaccuracies in the papers' proofs were found and corrected; 
    none affects the compared statements. They are recorded in the ErrorReport files of the automation folder.
